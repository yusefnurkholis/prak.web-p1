<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi To-Do List - Modul 5</title>
    <link rel="stylesheet" href="style5.css">
</head>

<body>
    <div class="todo-app">
        <h2>Daftar Tugas Saya</h2>
        <p class="task-counter" id="taskCounter" aria-live="polite">Total: 0 Tugas | Selesai: 0 | Belum Selesai: 0</p>

        <!-- Form Input Tugas -->
        <form id="todoForm" novalidate>
            <div class="input-section">
                <input type="text" id="taskInput" placeholder="Ketikkan tugas baru Anda..." aria-label="Tugas baru">
                <button type="submit" class="add-btn">Tambah</button>
            </div>
            <div class="error-message" id="inputError" role="alert"></div>
        </form>

        <!-- Daftar Tugas -->
        <ul class="todo-list" id="todoList"></ul>
        <button type="button" class="clear-completed-btn" id="clearCompletedBtn">Bersihkan Tugas Selesai</button>
    </div>

    <div class="confirm-overlay" id="confirmOverlay" hidden>
        <section class="confirm-dialog" role="dialog" aria-modal="true" aria-labelledby="confirmTitle" aria-describedby="confirmMessage">
            <div class="confirm-icon" aria-hidden="true">!</div>
            <h3 id="confirmTitle">Konfirmasi</h3>
            <p id="confirmMessage"></p>
            <div class="confirm-actions">
                <button type="button" class="dialog-btn cancel-btn" id="cancelConfirm">Batal</button>
                <button type="button" class="dialog-btn confirm-btn" id="acceptConfirm">Ya, lanjutkan</button>
            </div>
        </section>
    </div>

    <script src="scrip5.js"></script>
</body>

</html>

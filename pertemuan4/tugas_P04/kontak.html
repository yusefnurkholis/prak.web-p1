<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kontak | Yusep Nur Kholis</title>
    <link rel="stylesheet" href="style1.css">
</head>
<body>
    <header class="header">
        <h1>Formulir Kontak</h1>
        <nav aria-label="Navigasi utama">
            <ul>
                <li><a href="index.html">Beranda</a></li>
                <li><a href="kontak.html" aria-current="page">Hubungi Saya</a></li>
                <li><a href="project.html">Project</a></li>
                <li><a href="resume.html">Resume</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <section class="panel">
            <h2>Kirimkan Pesan atau Penawaran Proyek</h2>
            <form class="contact-form" action="#" method="get">
                <div class="field">
                    <label for="nama_pengirim">Nama lengkap</label>
                    <input type="text" id="nama_pengirim" name="nama_pengirim" autocomplete="name" required>
                </div>
                <div class="field">
                    <label for="email_pengirim">Alamat email</label>
                    <input type="email" id="email_pengirim" name="email_pengirim" autocomplete="email" required>
                </div>
                <div class="field">
                    <label for="jenis_layanan">Layanan yang dibutuhkan</label>
                    <select id="jenis_layanan" name="jenis_layanan" required>
                        <option value="">-- Pilih layanan --</option>
                        <option value="web">Pembuatan web</option>
                        <option value="app">Pengembangan aplikasi</option>
                        <option value="other">Lain-lain</option>
                    </select>
                </div>
                <div class="field">
                    <label for="pesan">Pesan</label>
                    <textarea id="pesan" name="pesan" rows="6" required></textarea>
                </div>
                <div class="form-actions">
                    <button class="btn btn-primary" type="submit">Kirim pesan</button>
                    <button class="btn btn-ghost" type="reset">Batal / reset</button>
                </div>
            </form>
        </section>

        <section class="panel">
            <h2>Kontak Lainnya</h2>
            <address>
                <p>Email: <a href="mailto:yusefnurkholis@gmail.com">yusefnurkholis@gmail.com</a></p>
                <p>Instagram: <a href="https://www.instagram.com/913yunk/">@913yunk</a></p>
            </address>
        </section>
    </main>

    <footer class="page-footer"><p>&copy; 2026 Teknik Informatika ITG</p></footer>
</body>
</html>
